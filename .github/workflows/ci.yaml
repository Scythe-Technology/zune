name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Zig
      uses: mlugg/setup-zig@v2
      with:
        version: 0.17.1
        use-cache: true

    - name: Run fmt
      run: zig fmt --check **/*.zig

  prep:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
          use-cache: true

      - name: Get Zune Version
        id: version
        run: |
          version=$(zig build version)
          echo "version=$version">> $GITHUB_OUTPUT

  test:
    needs: [fmt, prep]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux x86_64
            target: x86_64-linux-gnu
          - os: windows-latest
            name: Windows x86_64
            target: x86_64-windows
            ext: .exe
          - os: macos-15-intel
            name: macOS x86_64
            target: x86_64-macos
          - os: macos-26
            name: macOS aarch64
            target: aarch64-macos
          - os: ubuntu-22.04-arm
            name: Linux aarch64
            target: aarch64-linux-gnu
          - os: ubuntu-latest
            name: Linux riscv64
            target: riscv64-linux
            qemu-platform: riscv64

    name: ${{ matrix.name }}
    timeout-minutes: 20
    runs-on: ${{matrix.os}}
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Zig
      uses: mlugg/setup-zig@v2
      with:
        version: 0.17.1
        use-cache: true

    - name: Setup QEMU
      if: matrix.qemu-platform != ''
      uses: docker/setup-qemu-action@v1

    - name: Run info
      continue-on-error: ${{ matrix.qemu-platform != '' }}
      run: zig build run -Dtarget=${{ matrix.target }}${{ matrix.llvm != '' && ' -Dllvm' || '' }}${{ matrix.qemu-platform != '' && ' -fqemu' || '' }} -- info all

    - name: Run tests
      continue-on-error: ${{ matrix.qemu-platform != '' }}
      run: zig build test -Dtarget=${{ matrix.target }}${{ matrix.llvm != '' && ' -Dllvm' || '' }}${{ matrix.qemu-platform != '' && ' -fqemu' || '' }} --verbose
   
    - name: Build debug
      run: zig build -Dtarget=${{ matrix.target }} --verbose
